<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | Silverheart Studios</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <meta name="description" content="Sign up for the Silverheart Studios portal and tell the label what you are building.">
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header site-header-solid">
      <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="home/" aria-label="Silverheart Studios home">
          <img class="brand-logo" src="assets/silverheart-logo.png" alt="" aria-hidden="true">
          <span class="brand-name">Silverheart Studios</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-links">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="primary-links">
          <a href="home/#artists">Artists</a>
          <a href="login/">Login</a>
        </div>
      </nav>
    </header>

    <main id="main" class="auth-shell signup-shell">
      <section class="auth-visual signup-visual reveal" aria-label="Silverheart signup artwork">
        <img src="assets/artist-neon-carter.png" alt="Silverheart Studios abstract record artwork.">
        <div class="auth-visual-copy">
          <p class="eyebrow">Join Silverheart</p>
          <h1>Tell us about your sound.</h1>
          <p>Be specific so our team can quickly route your submission.</p>
        </div>
      </section>

      <section class="auth-card signup-card reveal" aria-labelledby="signup-title">
        <p class="eyebrow">New account</p>
        <h2 id="signup-title">Create your Silverheart profile</h2>
        <form class="stacked-form" data-form="signup">
          <div class="form-grid">
            <div class="field">
              <label for="signup-name">Full name</label>
              <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            </div>
            <div class="field">
              <label for="signup-email">Email address</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
          </div>

          <fieldset class="question-group">
            <legend>What best describes you?</legend>
            <label><input type="radio" name="role" value="artist" required> Artist</label>
            <label><input type="radio" name="role" value="producer"> Producer</label>
            <label><input type="radio" name="role" value="manager"> Manager</label>
          </fieldset>

          <fieldset class="question-group">
            <legend>What best describes your?</legend>
            <label><input type="checkbox" name="genre" value="pop"> Pop</label>
            <label><input type="checkbox" name="genre" value="rnb"> R&B</label>
            <label><input type="checkbox" name="genre" value="alternative"> Alt.</label>
            <label><input type="checkbox" name="genre" value="indie"> Indie</label>
          </fieldset>

          <div class="field">
            <label for="signup-link">Music/portfolio link</label>
            <input id="signup-link" name="link" type="url" placeholder="https://">
          </div>

          <div class="field">
            <label for="signup-goal">What do you want to build with Silverheart?</label>
            <textarea id="signup-goal" name="goal" rows="4" placeholder="Tell us about what you have in mind." data-autogrow required></textarea>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="signup-city">City</label>
              <input id="signup-city" name="city" type="text" autocomplete="address-level2" placeholder="London">
            </div>
            <div class="field">
              <label for="signup-contact">Preferred contact</label>
              <select id="signup-contact" name="contact">
                <option>Email</option>
              </select>
            </div>
          </div>

          <label class="check-row">
            <input type="checkbox" name="updates" checked>
            <span>Send me artist updates and release news</span>
          </label>

          <button class="button button-primary full-button" type="submit">Create profile</button>
          <div class="form-message" role="status" aria-live="polite"></div>
        </form>
        <p class="auth-switch">Already have access? <a href="login/">Login instead</a></p>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
