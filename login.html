<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Silverheart Studios</title>
   <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <meta name="description" content="Login page for the Silverheart Studios artist and collaborator portal.">
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header site-header-solid">
      <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Silverheart Studios home">
          <img class="brand-logo" src="assets/silverheart-logo.png" alt="" aria-hidden="true">
          <span class="brand-name">Silverheart Studios</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-links">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="primary-links">
          <a href="index.html#artists">Artists</a>
          <a href="signup.html">Sign up</a>
        </div>
      </nav>
    </header>

    <main id="main" class="auth-shell">
      <section class="auth-visual reveal" aria-label="Silverheart portal artwork">
        <img src="assets/silverheart-hero.png" alt="Silverheart Studios visual artwork.">
        <div class="auth-visual-copy">
          <p class="eyebrow">Login portal</p>
          <h1>Welcome back</h1>
          <p>Manage your artist profile and track updates from one simple creative dashboard.</p>
        </div>
      </section>

      <section class="auth-card reveal" aria-labelledby="login-title">
        <p class="eyebrow">Member login</p>
        <h2 id="login-title">Access your Silverheart account</h2>
        <form class="stacked-form" data-form="login">
          <div class="field">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6">
          </div>
          <label class="check-row">
            <input type="checkbox" name="remember">
            <span>Keep me signed in on this device</span>
          </label>
          <button class="button button-primary full-button" type="submit">Login</button>
          <div class="form-message" role="status" aria-live="polite"></div>
        </form>
        <p class="auth-switch">New to Silverheart? <a href="signup.html">Create an account</a></p>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
